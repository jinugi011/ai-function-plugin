ai:
  default-provider: claude
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
    effort: medium
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5
  abacus:
    api-key: ${ABACUS_API_KEY:}
    model: route-llm
  knowledge:
    location: classpath*:ai-knowledge/**/*.*
    max-examples: 5

  # 로컬 모델 (API 키 불필요) ─ 사용하려면 enabled: true
  ollama:
    enabled: false
    base-url: http://localhost:11434
    model: llama3.2            # 없으면 첫 호출 때 자동 다운로드
  llamacpp:
    enabled: false
    model: hf:Qwen/Qwen2.5-3B-Instruct-GGUF/qwen2.5-3b-instruct-q4_k_m.gguf
    model-dir: ${user.home}/.aiplugin/models
    server-binary: llama-server
    port: 8089

  # RAG: 문서 임베딩 + 벡터 DB 검색 ─ 사용하려면 enabled: true
  rag:
    enabled: false
    documents:
      - classpath*:rag-docs/**     # 시작 시 색인 (바뀐 문서만 다시 임베딩)
    chunk-size: 800
    top-k: 4
    min-score: 0.3
    embedding:
      provider: openai             # openai | ollama | openai-compatible
      # model: text-embedding-3-small
    store:
      type: file                   # file | qdrant | pgvector
      file-path: ./ai-rag/vector-store.json.gz
      qdrant-url: http://localhost:6333
      qdrant-collection: ai_documents
